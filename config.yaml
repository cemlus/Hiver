# Every tunable lives here. To switch LLM provider, change only models.*.name
# (LiteLLM "<provider>/<model>" strings) and put that provider's API key in .env.

brand: XboxSupport        # frozen in Phase 1: see results/eda.md and results/brand_validation.md
seed: 42
codebook_version: v1

models:
  # Examples: anthropic/claude-haiku-4-5, anthropic/claude-sonnet-5, openai/<model>,
  #           gemini/<model>, ollama/<model>
  # temperature: null = don't send it. Some models reject sampling params (claude-sonnet-5 and
  # claude-opus-5 return a 400). Reproducibility comes from the LLM cache, not from temperature.
  # reasoning_effort: null = provider default. disable | low | medium | high set Gemini's
  # thinking budget, which is spent out of max_tokens. Only part of the cache key when set.
  # timeout: seconds per request (LiteLLM's own default is 6000).
  agent:                  # production router, frozen 2026-09-13 after the dev A/B (DECISIONS [P7])
    name: groq/qwen/qwen3.8-27b
    temperature: 0
    max_tokens: 4096
    reasoning_effort: none  # structured classification needs no reasoning budget
    timeout: 120
  # Phase 7 A/B: two Groq candidates evaluated on the DEV set before the production model is
  # frozen. Both use the same prompt, schema, taxonomy and escalation policy; only the model differs.
  candidates:
    gpt_oss_120b:
      name: groq/openai/gpt-oss-120b
      temperature: 0
      max_tokens: 4096      # it spends reasoning tokens out of this budget
      reasoning_effort: null
      timeout: 120
    qwen3_8_27b:
      name: groq/qwen/qwen3.8-27b
      temperature: 0
      max_tokens: 4096
      reasoning_effort: none   # structured classification: no reasoning budget needed
      timeout: 120

  judge:                  # keep different from the agent model (self-preference bias)
    name: groq/openai/gpt-oss-120b  # different family from the router; same vendor, so separation is
    temperature: 0                  # weaker than cross-vendor would be (recorded in DECISIONS)
    max_tokens: 8192                # it spends reasoning tokens out of this budget
    reasoning_effort: null
    timeout: 180

embedding_model: sentence-transformers/all-MiniLM-L6-v2

data:
  raw_csv: data/raw/twcs.csv
  records: data/processed/records.parquet
  split_date: "2017-11-15"  # threads whose root tweet is earlier -> train (~69% of exchanges), else holdout

retrieval:
  k: 5
  # Corpus embeddings, built by scripts/build_embeddings.py over the train-only
  # grounding corpus. Committed so retrieval runs without downloading the model.
  embeddings: data/processed/corpus_embeddings.npy

drafting:
  max_reply_chars: 280        # a reply is a tweet
  max_attempts: 2             # one draft, then at most one revise (Phase 10)

thresholds:               # chosen on dev only (Phase 7); never tuned on golden
  # 0.0 disables policy rule (h). The router reports only 0.90/0.95 on dev and all 7 of its errors
  # carry 0.95, so its self-reported confidence cannot separate right from wrong: any usable
  # threshold would escalate the most confident items. See results/eval/agent_dev_calibration.md.
  intent_confidence: 0.0
  retrieval_similarity: 0.5

cache:
  path: data/cache/llm_cache.sqlite

results_store:
  path: results/runtime_outputs.jsonl

# Optional production adapters (Phase 12). The eval profile ignores this whole section.
integrations:
  store: jsonl            # jsonl | postgres
  cache: sqlite           # sqlite | redis
  escalation_sink: none   # none | log | slack

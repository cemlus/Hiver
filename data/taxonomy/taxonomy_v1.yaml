# Intent taxonomy v1 for XboxSupport. Hand-written.
# Taxonomy (intents + conversation states): FROZEN. Escalation policy: FROZEN after dev calibration.
# Rendered by: uv run python scripts/taxonomy_explore.py render
#   -> results/taxonomy/proposal.md  (evidence + final table)
#   -> data/codebook.md              (labeller-facing codebook)
# Every record ID below must be a train record (the renderer checks).
# tests/test_taxonomy_frozen.py pins the intent and state names; changing them means a new version.
version: v1, 2026-09-11
taxonomy_status: frozen
escalation_status: frozen
status: "Taxonomy FROZEN (v1, 2026-09-11): 11 intents and 4 conversation states. Escalation policy FROZEN (2026-09-11) after calibration on the 40-item dev set. The 200-item golden set is labelled against this version."

evidence_status: >-
  The 150 exchanges in `data/taxonomy/discovery_sample_coding.csv` are **taxonomy discovery
  evidence, not the evaluation gold set.** One person (the assistant, while drafting) coded them to
  find and size candidate intents. They come from the **train** split, so they can never enter dev
  or golden. The golden set will be sampled from the holdout split and labelled against the frozen
  codebook. Counts derived from this sample are rough estimates.

preamble:
  - "**How this was built.**"
  - "- **Open coding.** 150 random train exchanges were read with their conversation context. Each got a conversation state and, where there was a support request, the intent whose response and escalation strategy fits. A runner-up was noted where one was plausible, and secondary issues where a message raised two."
  - "- **Exploratory topics.** NMF topics over train first contacts (`results/taxonomy/topics.md`) were used only to check that no frequent theme was missed."
  - "- **Examples.** Extra examples for rare intents came from regex searches over train, read by hand."
  - ""
  - "**Final changes before the freeze.**"
  - "- S1 now requires that **no unresolved support issue remains** for `acknowledgement_closing`. 'Will try tonight' and 'I'll get back to you' are `issue_followup`. This moved one sampled exchange (O048)."
  - "- A new internal-only field, `secondary_intents`, keeps the other issue(s) of a multi-issue message. T0 picks the one primary intent that is scored."
  - "- `product_info_feedback` stays merged. Controllers stay inside `hardware_devices` as an internal subtype."
  - "- `subtype`, `event_tag` and `secondary_intents` are internal and never scored."

label_fields:
  - ["conversation_state", "always, scored", "One of the 4 states below."]
  - ["intent", "scored, only when the state is `new_issue` or `issue_followup`", "Exactly one of the 11 intents below: the **primary** intent, chosen by T0 when a message raises several issues. Blank for `acknowledgement_closing` and `social_offtopic`."]
  - ["secondary_intents", "optional, internal, never scored", "The other intent(s) of a multi-issue message, separated by `;`. Each must have a default risk no higher than the primary's (that's what T0 guarantees)."]
  - ["risk_level", "always", "`low` / `medium` / `high`. Start from the primary intent's default risk (`low` for states without an intent), then apply the risk rules; the highest wins."]
  - ["escalate", "always, scored", "`yes` / `no`, from the escalation rules. It is decided separately from the intent."]
  - ["reason_code", "always", "Escalation: SECURITY, SAFETY_LEGAL, BILLING_DISPUTE, ACCOUNT_SPECIFIC, REPEAT_CONTACT, STEPS_FAILED, HIGH_ANGER, OUT_OF_SCOPE, LOW_CONFIDENCE. Auto: ROUTINE_TROUBLESHOOTING, GENERAL_INFO. REPLY_FAILED_CHECKS is set only by the agent when its own drafted reply fails validation; labellers never use it."]
  - ["subtype, event_tag", "optional, internal, never scored", "Analysis notes only."]

procedure:
  - "Read the context turns, oldest first, then the customer message. Ignore the historical brand reply: the classifier won't see it."
  - "Choose `conversation_state`. Apply S1 and S2 when unsure. `acknowledgement_closing` needs **no unresolved issue left**."
  - "If the state carries an intent, choose one primary intent from the definitions. If several issues are raised, T0 picks the primary and the rest go in `secondary_intents`. If two intents fit one issue, apply T1–T11 in order. Use `needs_more_context` only through T12."
  - "Set `risk_level`: start from the primary intent's default risk, apply every risk rule that fires, and keep the highest."
  - "Set `escalate` and `reason_code` from the escalation combination rules."
  - "Optionally note `subtype` and `event_tag`."

states_without_intent: [acknowledgement_closing, social_offtopic]

conversation_states:
  - name: new_issue
    definition: "The message raises a support issue this customer hasn't already raised in this thread. This includes replies to brand announcements and to other customers' tweets."
    strategy: "Handled by its intent."
    examples: [332201, 903420, 2244439]
  - name: issue_followup
    definition: "The message continues a support issue this customer already raised in the thread, or answers the brand about it: details, 'tried that', 'still broken', 'are you going to help?'. Promises to try something or report back ('will try tonight', 'I'll get back to you') are also follow-ups, because the issue is still open. It takes the thread's issue as its intent."
    strategy: "Handled by its intent. The reply must use the context, and must not repeat steps the customer says they've tried."
    examples: [1068162, 1848043, 1376956, 866890]
  - name: acknowledgement_closing
    definition: "The customer thanks the brand, confirms the issue is fixed, or says okay, **and no unresolved support issue remains**. Nothing new is asked, and nothing is pending on the customer's side."
    strategy: "A short close-the-loop reply offering further help. No troubleshooting, no retrieval."
    examples: [1523187, 831330, 2124069, 1111772]
  - name: social_offtopic
    definition: "No support request at all: praise, banter, self-promotion, tweets that only tag the brand."
    strategy: "A short friendly reply (or none). No troubleshooting, no retrieval."
    examples: [2006809, 295529, 2380329]

# S1 made explicit: message -> state, and why.
s1_examples:
  - ["Thanks, it works now", acknowledgement_closing, "Resolved; nothing open"]
  - ["Everything is fixed", acknowledgement_closing, "Resolved; nothing open"]
  - ["Okay, thank you", acknowledgement_closing, "Nothing asked, nothing pending"]
  - ["Will try tonight", issue_followup, "The fix hasn't been tried: the issue is still open"]
  - ["I'll try that and let you know", issue_followup, "Outcome pending: the issue is still open"]
  - ["I'll get back to you", issue_followup, "Outcome pending: the issue is still open"]

risk_levels:
  low: "Safe to auto-handle with public guidance."
  medium: "Auto-handle the first-line answer, but watch for the conditions in the intent's escalation policy."
  high: "Involves money, identity, safety or an already-failed support experience. Always escalate."

intents:
  - name: connectivity_xbox_live
    definition: "The customer can't reach Xbox Live or a game's online service, or their online session is unstable: service sign-in, disconnects, lag, NAT, party chat connection, game servers, or 'is Live down?'."
    include:
      - "Xbox Live or game servers down, unreachable or 'failed to allocate'; outage and status questions"
      - "Disconnects, lag, NAT type, lobby or matchmaking failures"
      - "Party chat that won't connect, drops people, or has no audio because of connection or privacy settings"
      - "Network errors during setup (can't get online)"
    exclude:
      - "Credential problems (forgotten password, recovery, account creation) → `account_access_profile`"
      - "'Can't play online, it says I need Gold' → `entitlements_subscriptions_codes`"
      - "An app or game misbehaving while online works, and party menu/UI glitches → `software_game_app`"
    strategy: "Check for a known outage first and point to the status page. Otherwise give network troubleshooting: power cycle the console and router, check NAT and detailed network stats, wired vs Wi-Fi."
    default_risk: low
    escalation: "Auto (ROUTINE_TROUBLESHOOTING, or GENERAL_INFO for outages). Escalate (STEPS_FAILED) when the standard steps have already failed."
    escalation_short: "auto"
    examples: [332201, 2196917, 1529692, 2071187, 713558, 2301563, 1706501, 1409571]

  - name: install_download_update
    definition: "Getting software onto the console fails or stalls: game or app downloads and installs, disc installs, system updates, storage, or content that has to be re-downloaded."
    include:
      - "'Installation stopped', downloads stuck or slow, queue problems"
      - "Console or game updates that fail, loop or error"
      - "Games deleted or needing reinstall after an update; storage-full errors"
      - "Disc games that won't install"
    exclude:
      - "Installed content that crashes or won't start → `software_game_app`"
      - "Owned content the store won't let the customer get → `entitlements_subscriptions_codes`"
      - "The disc drive not reading any disc → `hardware_devices`"
    strategy: "Give install and update troubleshooting (clear local storage, offline system update, cancel and reinstall, check storage and the queue), or point to a known publisher-side issue."
    default_risk: low
    escalation: "Auto (ROUTINE_TROUBLESHOOTING). Escalate (STEPS_FAILED) when the standard steps have already failed, e.g. an update that bricked the console."
    escalation_short: "auto"
    examples: [903420, 805812, 1236555, 2495936, 1704319, 2304167, 1093610, 960419]

  - name: hardware_devices
    definition: "A physical device misbehaves: console power, shutdowns, heat or noise, disc drive, display/HDMI, controllers, headsets, Kinect, external storage. Also repair, warranty and replacement. Controllers stay here; their subtype is internal."
    include:
      - "Console won't power on, shuts down, has no signal, green dots, fan noise"
      - "Disc drive won't read discs or scratches them; Blu-ray playback errors that point at the drive"
      - "Controllers that won't pair, disconnect, desync, or have faulty buttons; headset and mic problems"
      - "External drives not detected; device registration and warranty"
    exclude:
      - "One game or app freezing while everything else works → `software_game_app`"
      - "Wrong item in the box, delivery or retailer problems → `purchases_billing_orders`"
    strategy: "Give device troubleshooting (power cycle, another outlet, re-pair and update the controller, check the drive). If the device is faulty, route to the online repair or replacement process."
    default_risk: medium
    escalation: "Auto for first-line steps (ROUTINE_TROUBLESHOOTING), including a bare 'it broke' with no request: give the steps and ask for the symptom. Escalate (ACCOUNT_SPECIFIC) when the customer asks for a repair, replacement, warranty or servicing, or a repaired or replaced device still fails. Escalate (STEPS_FAILED) when the first-line steps have already failed."
    escalation_short: "auto → escalate for repair"
    subtypes:
      console: "Power, shutdowns, heat, noise, whole-console freezes"
      disc_drive: "The disc drive, and reading discs or Blu-rays"
      display_output: "HDMI, no signal, picture artefacts"
      controller_accessory: "Controllers, headsets, Kinect, adapters"
      external_storage: "External drives"
    examples: [60195, 1376956, 2244439, 2724934, 2442246, 1029282, 2209929, 1371729, 2202292]

  - name: software_game_app
    definition: "Installed software misbehaves: a game or app crashes, won't launch or has a bug; dashboard/UI problems after an update; app features such as notifications, messaging, streaming and achievements. Merged for v1."
    include:
      - "A specific game or app crashes, freezes, won't open, or shows an error code"
      - "Dashboard/Guide UI broken or slow after an update; notifications, messages, keyboard"
      - "Achievements not unlocking; in-game content or credits missing because of a bug"
      - "Store or Xbox app crashing (the app itself, not a purchase)"
    exclude:
      - "Download or installation failures → `install_download_update`"
      - "Can't reach Live or game servers → `connectivity_xbox_live`"
      - "Paid content missing → `entitlements_subscriptions_codes`"
    strategy: "Give app or game troubleshooting (power cycle, remove and re-add the profile, uninstall and reinstall, check whether the console is in the Insider preview). Point to the developer or publisher for game-side bugs and patches."
    default_risk: low
    escalation: "Auto (ROUTINE_TROUBLESHOOTING). Escalate (STEPS_FAILED) when the steps have already failed; OUT_OF_SCOPE (developer) for patch timelines."
    escalation_short: "auto"
    subtypes:
      game: "A specific game's bug, crash or content"
      app: "A media or utility app, the Store app, messages, Mixer"
      dashboard_system: "Dashboard, Guide, notifications, system UI"
    examples: [966038, 1068162, 1548583, 1029276, 2624341, 1848043, 2302875, 1546338]

  - name: account_access_profile
    definition: "The customer's Microsoft/Xbox account itself: signing in with their credentials, recovery, creation, email/alias, gamertag, child/adult and family settings, profile data. A compromised account is this intent, with the SECURITY risk rule on top."
    include:
      - "Can't sign in to *my* account, password or email recovery, account creation errors"
      - "Gamertag changes and availability, email alias, tenure or profile data"
      - "Child account rules and family settings"
      - "Account hacked or used by someone else (the SECURITY rule applies)"
    exclude:
      - "Service-wide sign-in outages → `connectivity_xbox_live`"
      - "Home Xbox and licences → `entitlements_subscriptions_codes`"
      - "Another player's conduct → `enforcement_safety`"
    strategy: "Link the self-service guide (recovery, alias, gamertag, family settings). Fixes that touch the customer's own account need identity verification, so hand off to chat or phone support."
    default_risk: medium
    escalation: "Escalate (ACCOUNT_SPECIFIC) when the fix needs someone to see or change this customer's own account (sign-in failures on their account, linked accounts, gamertag or profile changes that fail), which is most cases. Auto (GENERAL_INFO) for general how-to or policy questions such as child-account rules."
    escalation_short: "escalate if account-specific"
    examples: [1678269, 1706513, 345595, 2018153, 1852555, 1061269, 2258377, 2232817]

  - name: purchases_billing_orders
    definition: "The money or the order: purchases that fail, unexpected or duplicate charges, refunds, pricing and sales, pre-order deliveries, wrong items, retailer problems. Kept separate from entitlements."
    include:
      - "Purchase fails with a payment error; payment method problems"
      - "Charged twice or unexpectedly; refund requests; sale price not honoured"
      - "Pre-order delivery or shipment; wrong item in the box; retailer issues"
    exclude:
      - "Paid, but the game, membership or code isn't showing → `entitlements_subscriptions_codes` (T5)"
      - "Policy questions with no problem ('why does a free game need a card?') → `product_info_feedback`"
    strategy: "Acknowledge, share generic tips if relevant (check the payment info, try the web store), then route charges, refunds and orders to billing/chat support, and retailer orders to the retailer."
    default_risk: high
    escalation: "Always escalate (BILLING_DISPUTE for charges and refunds, otherwise ACCOUNT_SPECIFIC). Generic tips may go in the reply, but a person owns the case."
    escalation_short: "escalate"
    examples: [917784, 941532, 23503, 2289318, 2244688, 15148, 1765600, 2129547]

  - name: entitlements_subscriptions_codes
    definition: "Something the customer is entitled to isn't recognised or delivered: Gold / Game Pass memberships and trials, code or gift-card redemption, DLC and pre-order bonuses, owned games missing, licences, Home Xbox, game sharing. Merged for v1."
    include:
      - "Gold or Game Pass bought or active but not recognised; trial questions"
      - "Codes or gift cards that won't redeem; beta or early-access codes"
      - "Pre-order bonuses, DLC or season-pass items, or purchased games missing from the library"
      - "Home Xbox changes, game sharing, licences for owned games"
    exclude:
      - "Payment failures, double charges, refunds → `purchases_billing_orders`"
      - "Bare error codes unrelated to redemption → `software_game_app` / `connectivity_xbox_live`"
    strategy: "Give entitlement troubleshooting (check subscriptions and order history, remove and re-add the profile, power cycle, follow the redemption guide). Hand off if it's still missing."
    default_risk: medium
    escalation: "Auto for first-line steps (ROUTINE_TROUBLESHOOTING). Escalate (ACCOUNT_SPECIFIC) when a specific order, code, charge or licence has to be looked up. Escalate (STEPS_FAILED) when the steps have already failed."
    escalation_short: "auto → escalate if still missing"
    subtypes:
      membership: "Gold / Game Pass / trials / free-play promotions"
      code_redemption: "Codes, gift cards, keys"
      dlc_bonus_content: "DLC, pre-order bonuses, season-pass items"
      purchased_item_missing: "Paid for, but the item isn't in the library"
      licence_home_sharing: "Licences, Home Xbox, game sharing"
    examples: [1649377, 2300747, 1410288, 1758424, 1550471, 1777618, 2365309, 2108979]

  - name: enforcement_safety
    definition: "Suspensions, bans and enforcement messages; reports of other players' conduct (harassment, threats, cheating); code-of-conduct questions; content rejected by moderation."
    include:
      - "'Why was I banned or suspended?', appeals, enforcement notices"
      - "Reporting another player, harassment, 'why wasn't action taken?'"
      - "Rejected gamerpics or content; code-of-conduct questions"
    exclude:
      - "The customer's own account being hacked → `account_access_profile`"
      - "Anger at support with no enforcement topic → `support_process_complaint`"
    strategy: "Use the fixed policy reply: support can't discuss or influence enforcement; point to the enforcement site and case review, and explain how to report players. Never speculate about an outcome."
    default_risk: medium
    escalation: "Auto with the policy template (GENERAL_INFO). The SAFETY_LEGAL rule escalates threats of harm, minors at risk and doxxing."
    escalation_short: "auto (policy)"
    examples: [1298728, 891188, 1531834, 2244476, 431515, 2181311, 2188986, 344739]

  - name: product_info_feedback
    definition: "Questions about how things work or what's available, and feedback or feature requests: specs, compatibility, backward compatibility, setup, how-tos, availability, policies, suggestions, negative opinions on design or updates. Questions and feedback stay merged."
    include:
      - "How-to and 'does X support Y' questions (1080p streaming, external SSD, setup without internet)"
      - "Backward-compatibility and content availability requests"
      - "Feature requests and negative opinions on design or updates"
      - "Policy questions (why a payment method is needed, trial limits in general)"
    exclude:
      - "The customer reports that something is failing → the matching issue intent (T10)"
      - "Praise with no request → `social_offtopic` state (S2)"
    strategy: "Answer the factual question from the knowledge base. For suggestions, thank the customer and point to the feedback site. Never speculate on release dates or the roadmap."
    default_risk: low
    escalation: "Auto (GENERAL_INFO). OUT_OF_SCOPE when the answer belongs to a third party (a publisher or retailer)."
    escalation_short: "auto"
    examples: [1595815, 1376297, 1769680, 2382110, 1371151, 870619, 2232755, 1141440]

  - name: support_process_complaint
    definition: "The message is mainly about the support experience, not a product problem: unanswered or repeated contacts, rude or unhelpful agents, demands for a human or another channel, general 'no one helps'."
    include:
      - "'Still waiting for help', 'chatted 4 times, still no solution'"
      - "Complaints about an agent or phone support; 'are you going to help me or not?'"
      - "Asks for another channel because the offered one doesn't work for them"
    exclude:
      - "A complaint that names a concrete product issue → that issue's intent, with the REPEAT_CONTACT / HIGH_ANGER risk rules"
      - "Anger about bans → `enforcement_safety` (T8)"
      - "Vague help requests without a complaint about support → `needs_more_context` (T9)"
    strategy: "Apologise, acknowledge the history, ask for the one missing detail or offer the right channel, and hand the case to a person."
    default_risk: high
    escalation: "Always escalate (REPEAT_CONTACT, or HIGH_ANGER when no repeat contact is stated)."
    escalation_short: "escalate"
    examples: [414172, 1370514, 1451336, 365015, 1534637, 1029357, 2370318, 248431]

  - name: needs_more_context
    definition: "Even with the available thread context, the support issue can't be determined confidently enough to act."
    include:
      - "A bare help request, image or link only: 'Any ideas or help? <URL>', 'Hello? Need assistance'"
      - "'Having the same issues too' with no thread to inherit from"
      - "A pointer to an earlier question that isn't in the data; frustration with a screenshot only"
    exclude:
      - "Follow-ups whose issue is in the context → the thread's intent (`issue_followup`)"
      - "Complaints about support itself → `support_process_complaint` (T9)"
    strategy: "Ask exactly one targeted clarifying question that names the missing detail (e.g. 'Which console, and what exact error text do you see?'). Never send a generic reply or a guess."
    default_risk: low
    escalation: "Auto: the clarification is sent (GENERAL_INFO). Escalate (LOW_CONFIDENCE) if the brand has already asked this customer for clarification in this thread. Untested on dev: no dev item was vague after a clarification."
    escalation_short: "auto (one clarifying question)"
    examples: [743704, 899017, 2264062, 2453133, 2055978, 2438004, 205579]

risk_rules:
  - [account_compromised, "Someone else is using or has taken the account; hacked; unauthorised sign-ins or purchases.", "`security`", high, SECURITY]
  - [harm_or_legal, "Threats of violence or self-harm, minors at risk, doxxing; lawsuits, police, lawyers, regulators.", "`legal_threat`", high, SAFETY_LEGAL]
  - [money_dispute, "Charged twice or without consent, refund refused, money taken.", "`billing_dispute`", high, BILLING_DISPUTE]
  - [repeat_contact, "Says they already contacted support about this issue (DM, chat, phone, an earlier unanswered tweet) or have waited days. Raises the risk only; it doesn't escalate on its own.", "`prior_contact`, `repeat_contact_cue` (partial)", medium, REPEAT_CONTACT]
  - [steps_failed, "Says the standard first-line fix for this issue was already tried (by themselves or as advised) and the problem persists. Escalates on every intent; the reason is REPEAT_CONTACT if a repeat contact is also stated.", "`repeat_contact_cue` (partial)", medium, STEPS_FAILED]
  - [strong_anger, "Profanity, insults or abuse aimed at Xbox or support, or a threat to leave. Frustration, sarcasm, an angry emoji or disputing a decision alone don't count.", "`anger`", medium, HIGH_ANGER]

escalation_combination:
  - "**FROZEN (2026-09-11)** after calibration on the 40-item dev set (`results/escalation/dev_calibration.md`)."
  - "`risk_level` = the highest of the primary intent's default risk (`low` for states without an intent) and the risk of every rule that fires."
  - "`escalate = yes` if any of these hold:"
  - "(a) `risk_level` is high."
  - "(b) The intent is `purchases_billing_orders` or `support_process_complaint` (always)."
  - "(c) Account or entitlements, and the fix needs this customer's own account, order, code or licence (ACCOUNT_SPECIFIC)."
  - "(d) Hardware, and a repair, replacement, warranty or servicing is requested, or a repaired or replaced device still fails (ACCOUNT_SPECIFIC)."
  - "(e) `steps_failed` fires, on any intent (REPEAT_CONTACT if `repeat_contact` also fires, else STEPS_FAILED)."
  - "(f) `strong_anger` fires on an intent whose default risk is medium or high (HIGH_ANGER)."
  - "(g) It's `needs_more_context` and the brand already asked this customer for clarification in the thread (LOW_CONFIDENCE)."
  - "(h) Phase 7: the classifier's confidence is below the threshold set on dev (LOW_CONFIDENCE)."
  - "(i) System only: the drafted reply fails validation after its retries (REPLY_FAILED_CHECKS)."
  - "`repeat_contact` alone does not escalate; it only raises the risk level."
  - "`reason_code`, when escalating, is the first match in this order: SECURITY > SAFETY_LEGAL > BILLING_DISPUTE > ACCOUNT_SPECIFIC > REPEAT_CONTACT > STEPS_FAILED > HIGH_ANGER > OUT_OF_SCOPE > LOW_CONFIDENCE > REPLY_FAILED_CHECKS. When not escalating: ROUTINE_TROUBLESHOOTING for fixes, GENERAL_INFO otherwise."
  - "Cue `prior_clarification`: the brand asked this customer for missing details earlier in the thread. Brand announcements, answers and troubleshooting steps don't count."
  - "These rules apply on top of any intent or state. There are no intents for hacked accounts, anger or threats."
  - "Phase 2's `customer_escalation_signals` (keyword cues) map onto these rules as shown in the signal column. They are weak hints only; the labeller decides."

calibration:
  - "**Status:** done. The policy above was calibrated on the dev set and frozen on 2026-09-11. The full comparison is in `results/escalation/dev_calibration.md` (`scripts/calibrate_escalation.py`); `DECISIONS.md` records the changes."
  - "**Dev set:** 40 holdout exchanges, one per thread, all eval-eligible: 16 random and 24 targeted (4 per behaviour below). Drawn blind by `scripts/sample_dev.py` into `data/golden/dev_labeling_sheet.csv`. Dev is used for tuning only. It is never reported, never used for few-shot examples, and never put in the index."
  - "**Labels:** ChatGPT drafts made with this codebook, reviewed and approved item by item by the project owner. They are not blind human labels (see `DECISIONS.md`). Fixes made after review are recorded in each item's notes."
  - "**Procedure:** the draft rules were applied to the labelled intents and cues and compared with each item's `escalate` label. A rule was changed only where the dev evidence disagreed."
  - "**Result:** the draft as written agreed with 37 of 40 labels; the frozen policy agrees with all 40. The one change in behaviour splits `steps_failed` out of `repeat_contact`, so failed steps escalate on every intent (D26, D31, D35). The other changes only tighten the wording."
  - "**Behaviours:**"
  - "- `strong_anger`: unchanged; it escalates only medium- and high-risk intents. No dev item had anger on a low-risk intent."
  - "- `repeat_contact`: on its own it does not escalate (D01); failed steps do."
  - "- Account-specific handling: escalate when this customer's own account, order, code or licence is needed; how-to stays auto. The auto side is untested on dev."
  - "- Low-confidence escalation: a threshold on the classifier's confidence, set on dev in Phase 7."
  - "- `needs_more_context` after a prior clarification: escalate. Untested: no dev item was vague after a clarification."
  - "- Repair / replacement: escalate on an explicit request or after failed steps; a bare 'it broke' stays auto. Dev can't separate the two triggers, because every repair item also had failed steps."
  - "**Next:** sample and label the 200-item golden set from the holdout, excluding every dev thread."

scoring:
  - "How the golden set will be scored (`src/eval`, Phase 9). Every metric gets a bootstrap 95% CI and is reported separately for the random and stratified slices."
  - "- **Conversation state:** accuracy and macro-F1 over the 4 states, on all items."
  - "- **Intent:** macro-F1 over the 11 intents, **conditional on intent-bearing states**: only items whose gold state is `new_issue` or `issue_followup`. A missing or extra intent prediction counts as an error. Also reported: per-intent precision, recall and F1, and the confusion matrix."
  - "- **Escalation:** precision and recall of `escalate = yes` on all items. **Must-escalate recall** is the recall on items whose gold `risk_level` is high or whose gold reason is SECURITY, SAFETY_LEGAL or BILLING_DISPUTE. This is the safety metric."
  - "- **Joint routing correctness:** the share of items where the state is right, the primary intent is right (when the gold state carries one), and `escalate` is right, all at once."
  - "- **Never scored:** `secondary_intents`, `subtype`, `event_tag`. `reason_code` agreement is reported for information only."
  - "- **Analysis slices:** first contact vs follow-up, and event-tied vs not, where event tags were noted."

events:
  fall_update_2017: "The Xbox One Fall Update (Oct 2017): dashboard redesign, update problems, praise and complaints"
  cod_wwii_launch: "Call of Duty: WWII launch (Nov 3, 2017): server and pre-order issues"
  battlefront2_launch_beta: "Star Wars Battlefront II beta and launch (Oct–Nov 2017)"
  xbox_one_x_launch: "Xbox One X / Project Scorpio launch (Nov 7, 2017): deliveries, new-console issues"
  xbox_live_outage: "Xbox Live sign-in or service outages acknowledged by the brand"
  friday13_movie_sale: "Friday the 13th movie-collection sale whose purchase failed"
  hurricane_maria: "Customers affected by Hurricane Maria (Puerto Rico, 2017)"

# Deterministic rules, applied in this order: S1–S2 (state), T0 (multi-issue), T1–T11, T12.
tie_breaks:
  - {id: S1, between: [acknowledgement_closing, issue_followup], rule: "Label `acknowledgement_closing` only if **no unresolved support issue remains**: the customer confirms a fix, or thanks or says okay with nothing open. If the problem persists, new details are given, anything is asked, or the customer will try something or report back later ('will try tonight', 'I'll get back to you'), label `issue_followup` with the thread's intent. See the S1 examples table.", examples: [1523187, 866890]}
  - {id: S2, between: [social_offtopic, product_info_feedback], rule: "If the message contains a suggestion, a request, a question, or a negative opinion on design, label state `new_issue` with intent `product_info_feedback`. Otherwise (praise, banter, promotion) label `social_offtopic`.", examples: [2006809, 1141440]}
  - {id: T0, between: [], rule: "If a message raises two or more issues, the **primary** (scored) intent is the one with the higher default risk (high > medium > low). If they are tied, it's the one mentioned first. The others go in `secondary_intents`, which is internal and never scored.", examples: [2114221, 1540213]}
  - {id: T1, between: [software_game_app, hardware_devices], rule: "If the symptom affects the whole console or a device (power, no signal, shutdown, disc drive, noise, pairing, a broken controller), label `hardware_devices`. Otherwise (one game, app or screen), label `software_game_app`.", examples: [1118847, 1548583]}
  - {id: T2, between: [software_game_app, install_download_update], rule: "If it fails while being downloaded, installed or updated (progress, queue, storage, update error), label `install_download_update`. If it is installed but misbehaves when run, label `software_game_app`.", examples: [903420, 1068162]}
  - {id: T3, between: [connectivity_xbox_live, software_game_app], rule: "If the customer can't reach Xbox Live, a game's servers or a party, or is disconnected or lagging, label `connectivity_xbox_live`. If a feature is broken while online works, label `software_game_app`.", examples: [2301563, 966038]}
  - {id: T4, between: [connectivity_xbox_live, account_access_profile], rule: "If sign-in fails because of this customer's credentials, recovery, creation or profile, label `account_access_profile`. If sign-in fails for many users, or because of the network or an outage, label `connectivity_xbox_live`.", examples: [1678269, 713558]}
  - {id: T5, between: [entitlements_subscriptions_codes, purchases_billing_orders], rule: "If the money moved and the item, membership or code is missing or unrecognised, label `entitlements_subscriptions_codes`. If the problem is the transaction itself (it fails, is duplicated, needs refunding, or the order hasn't arrived), label `purchases_billing_orders`.", examples: [1550471, 23503]}
  - {id: T6, between: [entitlements_subscriptions_codes, connectivity_xbox_live], rule: "If 'can't play online' comes with a mention of Gold, Game Pass, a trial, a code, or 'profile not allowed to play Xbox Live', label `entitlements_subscriptions_codes`. Otherwise label `connectivity_xbox_live`.", examples: [1758424, 2071187]}
  - {id: T7, between: [entitlements_subscriptions_codes, account_access_profile], rule: "If it's about what the customer may use (licences, Home Xbox, game sharing, memberships), label `entitlements_subscriptions_codes`. If it's about who the customer is (sign-in, identity, age, gamertag, profile), label `account_access_profile`.", examples: [1777618, 2018153]}
  - {id: T8, between: [enforcement_safety, support_process_complaint], rule: "If the message mentions a ban, suspension, report, moderation or the enforcement team, label `enforcement_safety`. Otherwise label `support_process_complaint`.", examples: [2415198, 1370514]}
  - {id: T9, between: [support_process_complaint, needs_more_context], rule: "If the message complains about support responsiveness or quality (waiting, unanswered, rude, 'no one helps'), label `support_process_complaint`. If it's only a vague request for help, label `needs_more_context`.", examples: [1534637, 899017]}
  - {id: T10, between: [product_info_feedback, install_download_update], rule: "If the customer reports that something failed ('can't install X'), label the matching issue intent (here `install_download_update`); the reply grounds any product fact, such as backward-compatibility status. If the customer asks whether or how something exists or works, label `product_info_feedback`.", examples: [1697828, 1595815]}
  - {id: T11, between: [hardware_devices, purchases_billing_orders], rule: "If the device itself is faulty (including a warranty claim for a fault), label `hardware_devices`. If the problem is delivery, a wrong item, or a retailer dispute, label `purchases_billing_orders`.", examples: [2244439, 1765600]}
  - {id: T12, between: [needs_more_context], rule: "Use `needs_more_context` only if, after reading the message and the thread context, no intent definition and no rule above applies with confidence. Never use it for a follow-up whose thread states the issue.", examples: [743704, 1848043]}

